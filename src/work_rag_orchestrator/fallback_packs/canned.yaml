  jailbreak: |-
    متأسفم، محدودیت‌های اساسی دستیار تغییرپذیر نیست. لطفاً پرسش خود را در حوزه اعتبارسنجی و گزارش اعتباری مطرح کنید.
  hate: |-
    محتوای پیام شما حاوی توهین یا زبان آزاردهنده است. لطفاً با لحن محترمانه دوباره بپرسید.
  offense: پیام شما حاوی الفاظ نامناسب است. لطفاً با لحن محترمانه دوباره بپرسید.
  profanity: پیام شما حاوی الفاظ نامناسب است. لطفاً با لحن محترمانه دوباره بپرسید.
  out_of_scope: |-
    من دستیار هوشمند شرکت اعتبارسنجی ایران هستم و فقط به سوالات مربوط به اعتبارسنجی، گزارش و امتیاز اعتباری (چک و تسهیلات بانکی) پاسخ می‌دهم. لطفاً پرسش خود را در همین حوزه مطرح کنید.
  pii: |-
    برای حفاظت از حریم خصوصی شما، نیازی به ارسال اطلاعات شخصی (مانند کد ملی یا شماره حساب) نیست. لطفاً پرسش را بدون درج اطلاعات شخصی مطرح کنید.
