faq_shortlist:
- q: اگر فکر می کنم اطلاعات گزارش اعتباری من اشتباه است، چه کاری باید انجام بدهم؟
  a: |-
    لطفا جهت راهنمایی برای اصلاح اطلاعات گزارش اعتبارسنجی خود به سامانه پشتیبانی شرکت اعتبارسنجی ایران مراجعه فرمایید:
    www.Support.ics24.ir
- q: مدیرعامل شرکت اعتبارسنجی ایران کیست؟
  a: |-
    دکتر رضا قاسم‌پور در حال حاضر مدیرعامل شرکت اعتبارسنجی ایران است. این شخص دانش‌آموخته دکتری ریاضی کاربردی و کارشناسی ارشد اقتصاد از دانشگاه تهران بوده و پیش از این مدیر طرح و برنامه بانک رفاه کارگران و عضو هیئت مدیره شرکت اعتبارسنجی ایران بوده است.
    در دوره مدیریت این شخص، نسخه جدید مدل امتیازدهی اعتباری با پوشش ۱۰۰ درصدی ارائه گردید و اعتبارسنجی به حوزه چک نیز وارد شد.
- q: اطلاعات موجود در گزارش اعتباری هر چند وقت یک‌بار به روزرسانی می‌شوند؟
  a: |-
    اطلاعات مربوط به وام‌ها و تسهیلات بانکی به‌صورت ماهانه از سوی بانک‌ها ارسال و به روز می‌شود؛ اما اطلاعات چک‌های برگشتی، بدهی‌های مالیاتی و احکام قضایی ظرف ۲۴ ساعت پس از تغییر یا رفع سوءاثر به روزرسانی می‌گردند.
- q: شرکت اعتبارسنجی ایران را معرفی کن.
  a: |-
    شرکت اعتبارسنجی ایران (سهامی خاص) در آبان‌ماه ۱۳۸۵ بر اساس ماده (۵) قانون تسهیل اعطای تسهیلات بانکی و آیین‌نامه نظام سنجش اعتبار تأسیس شده است.
    ارزش‌های محوری شرکت شامل «بی‌طرفی»، «رعایت محرمانگی اطلاعات» و «دقت و درستی» است. مأموریت اصلی شرکت نیز ایجاد اعتماد در بازارها، اقتصاد و جامعه از طریق تحلیل هوشمند رفتار مالی و تصمیم‌گیری آگاهانه تعریف شده است.
    شرکت در سال ۱۳۹۵ اولین مدل امتیاز اعتباری را با همکاری شرکت CreditInfo ارائه کرد. پس از بومی‌سازی سامانه در سال ۱۳۹۸، در سال ۱۴۰۳ نسخه دوم گزارش و امتیاز اعتباری مبتنی بر هوش مصنوعی توسط شرکت راه اندازی شد و در سال ۱۴۰۴ نیز گزارش و امتیاز اعتبارسنجی چک به بهره‌برداری رسید.
    در ادامه، شرکت اعتبارسنجی ایران در حال پیاده سازی محصولات مختلفی از جمله نسخه جدید مدل امتیاز اعتباری افراد و کسب و کارها، حد اعتباری تسهیلات و سامانه اعتبارسنجی معاملات می باشد.
- q: |-
    اگر چک برگشتی من رفع سوء اثر شده باشد، اما همچنان در گزارش اعتباری نمایش داده شود، چه اقداماتی باید انجام دهم تا از گزارش اعتباری من حذف شود؟
  a: |-
    حداکثر تا ۲۴ ساعت بعد از رفع سوءاثر چک، گزارش اعتباری شما بروزرسانی شده و شما می توانید گزارش جدید خود را دریافت کنید. البته لازم به ذکر است که حتی پس از رفع سوءاثر چک برگشتی، سوابق آن در گزارش اعتباری درج خواهد شد و در امتیاز شما تاثیرگذار است.
- q: اگر هیچ وامی نگرفتم رتبه اعتباریم چند حساب میشه؟
  a: |-
    در مدل امتیاز اعتباری، در صورتی که هیچ تسهیلاتی دریافت نکرده باشید، بر اساس سایر اطلاعات تکمیلی نظیر مالیات، صدک درآمدی خانوار، چکهای برگشتی و نقدشده، امتیاز اعتباری شخص محاسبه میشود. در حال حاضر، در صورت نداشتن وضعیت منفی نظیر محکومیت مالی اجرانشده با مبلغ بالا، چک برگشتی سوءاثرنشده و بدهی مالیاتی و همچنین نداشتن سابقه اخذ تسهیلات در شبکه بانکی، رتبه اعتباری شما در بازه C1 تا C3 خواهد بود. برای دریافت گزارش اعتباری خود به آدرس اینترنتی https://etebarito.ics24.ir مراجعه نمایید.
- q: هدف اصلی از اعتبارسنجی چیست؟
  a: |-
    ارزیابی میزان ریسک افراد و کسب و کارها بر اساس سوابق مالی گذشته، جهت برقراری عدالت در ارائه خدمات مالی و هدایت جامعه به سمت انضباط مالی است.
- q: راه‌های رسمی دریافت گزارش و ارتباط با واحد پشتیبانی چیست؟
  a: |-
    دریافت گزارش از طریق سامانه وب‌سایت اعتباریتو (etebarito.ics24.ir) صورت می‌گیرد و پشتیبانی مشتریان از طریق شماره تلفن ۰۲۱۴۱۵۲۲۲۲۲ یا سامانه ثبت تیکت support.ics24.ir پاسخگوی کاربران است.
- q: تفاوت اثر چک برگشتی «رفع‌سوءاثرنشده» با «رفع‌سوءاثرشده» در امتیاز چک چیست؟
  a: |-
    چک برگشتی رفع‌سوءاثرنشده جزئی از خطوط قرمز اعتباری است و امتیاز چک صادرکننده را مستقیماً به حداقل ممکن یعنی عدد ۱ (رتبه E3) می‌رساند. اما پس از رفع سوءاثر، فرد از این وضعیت خارج شده و اثر منفی سابقه آن ظرف ۵ سال به تدریج کاهش می‌یابد.
- q: چه عواملی امتیاز اعتباری من را کاهش می‌دهد؟
  a: |-
    به‌طور خلاصه، هر رفتاری که از دید نظام مالی کشور نشان‌دهنده‌ی افزایش ریسک عدم ایفای تعهدات باشد، باعث کاهش امتیاز اعتباری خواهد شد. در نتیجه:
    هرگونه تأخیر در پرداخت اقساط تسهیلات، حتی کوتاه‌مدت، می‌تواند امتیاز را کاهش دهد. همچنین وجود سابقه چک برگشتی و تاخیر در رفع سوءاثر آن، امتیاز شما را کاهش می دهد.
    قرار گرفتن در وضعیت‌های منفی تسهیلات مانند سررسیدگذشته، معوق، مشکوک‌الوصول یا سوخت‌شده نشان‌دهنده افزایش ریسک اعتباری شخص بوده و باعث کاهش جدی امتیاز و رتبه اعتباری می‌شود.
    ورود پرونده‌های مالیاتی به مرحله‌ی وصول و اجرا، داشتن محکومیت مالی یا ورشکستگی، و تعهد ارزی رفع‌نشده نیز از دیگر عوامل مستقیم افت امتیاز و رتبه هستند.
    لازم به ذکر است که تاثیر هر کدام از رفتارهای منفی ذکر شده در امتیاز اعتباری با تحلیل داده و به کارگیری هوش مصنوعی به دست می آید.
- q: آیا داشتن رتبه اعتباری بالا (مانند A1) دریافت وام از بانک را تضمین می‌کند؟
  a: |-
    گزارش اعتبارسنجی ابزاری مشورتی برای ارزیابی ریسک است و تصمیم‌گیری نهایی درباره اعطای وام و شرایط آن کاملاً بر عهده سیاست‌های داخلی خود بانک است.
- q: امتیاز اعتباری چیست و با رتبه اعتباری چه تفاوتی دارد؟
  a: |-
    امتیاز اعتباری یک عدد بین ۲۵۰ تا ۹۰۰ است که نشان می دهد شخص یا کسب و کار چقدر در بازپرداخت تعهدات خود خوش حساب است و ریسک اعتباری اش چقدر است. رتبه، در واقع دسته‌بندی همین امتیاز است (از A1 به عنوان بهترین تا E3 به عنوان ضعیف‌ترین.)
- q: سابقه تسهیلات و وام چند سال در گزارش اعتباری باقی می ماند؟
  a: |-
    سوابق تسهیلاتی، چک و مالیاتی شرکت‌ها تا ۵ سال در پایگاه داده محاسبه می‌شود. اما با گذشت زمان اثر مثبت و منفی آن‌ کمرنگ‌تر شده و پس از ۵ سال کلاً حذف می‌گردند.
- q: چه مواردی باعث می شود امتیاز اعتباری شرکت ۲۵۰ شود؟
  a: |-
    هر یک از موارد زیر در زمان استعلام، امتیاز شرکت را به ۲۵۰ (حداقل امتیاز ممکن) می‌رساند:
    1-چک برگشتی رفع سوءاثر نشده
    2-بدهی مالیاتی
    3-محکومیت مالی
    4-ورشکستگی و اعسار
    5-اقساط معوق و مشکوک‌الوصول
- q: چه مواردی باعث می شود امتیاز اعتباری من ۲۵۰ شود؟
  a: |-
    هر یک از موارد زیر در زمان استعلام، امتیاز شما را به ۲۵۰ و رتبه‌تان را به E3 می‌رساند:
    1-چک برگشتی رفع سوءاثر نشده
    2-بدهی مالیاتی (برای دریافت جزئیات بیشتر درباره پرونده های مالیاتی خود، به وبسایت my.tax.gov مراجعه کنید)
    3-محکومیت مالی اجرانشده
    4-ورشکستگی و اعسار
    5-اقساط معوق و مشکوک‌الوصول
    6-تاخیر در بازپرداخت بیش از ۹۰ روز متوالی
    لطفا توجه داشته باشید که ضامن یک شخص بد حساب بودن به تنهایی نمی تواند باعث رتبه E3 شود و تنها امتیاز شما را مقداری کاهش می دهد.
- q: خطوط قرمز امتیاز اعتباری چیست؟
  a: خطوط قرمز رفتارهایی هستند که باعث می شود شخص کمترین امتیاز ممکن را دریافت کند.
- q: خطوط قرمز امتیاز اعتباری برای افراد چیست؟
  a: |-
    هر یک از موارد زیر در زمان استعلام، امتیاز شما را به ۲۵۰ و رتبه‌تان را به E3 می‌رساند:
    1-چک برگشتی رفع سوءاثر نشده
    2-بدهی مالیاتی (برای دریافت جزئیات بیشتر درباره پرونده های مالیاتی خود، به وبسایت my.tax.gov مراجعه کنید)
    3-محکومیت مالی اجرانشده
    4-ورشکستگی و اعسار
    5-اقساط معوق و مشکوک‌الوصول
    6-تاخیر در بازپرداخت بیش از ۹۰ روز متوالی
    لطفا توجه داشته باشید که ضامن یک شخص بد حساب بودن به تنهایی نمی تواند باعث رتبه E3 شود و تنها امتیاز شما را مقداری کاهش می دهد.
- q: خطوط قرمز امتیاز اعتباری برای کسب و کارها چیست؟
  a: |-
    هر یک از موارد زیر در زمان استعلام، امتیاز شرکت را به ۲۵۰ (حداقل امتیاز ممکن) می‌رساند:
    1-چک برگشتی رفع سوءاثر نشده
    2-بدهی مالیاتی
    3-محکومیت مالی
    4-ورشکستگی و اعسار
    5-اقساط معوق و مشکوک‌الوصول
- q: جدیدا وام گرفته ام. امتیازم چطور می شود؟
  a: |-
    در این حالت، از داده‌های جایگزین مثل صدک درآمدی، سوابق مالیاتی و وضعیت ضمانت شما جهت محاسبه امتیاز اعتباری استفاده می شود و در این حالت، رتبه شما بین C1 تا C3 است.
    پس از ۵ ماه پرداخت قسط، امتیاز شما بر اساس مدل اصلی محاسبه خواهد شد و در صورت بازپرداخت به موقع اقساط، رتبه شما از C فراتر می رود.
- q: به عدد امتیازم اعتراض دارم. چه اقدامی باید انجام دهم؟
  a: |-
    امتیاز و رتبه اعتباری، حاصل محاسبات آماری و مدل‌های هوش مصنوعی و بر اساس سوابق مالی شماست. به همین دلیل، امکان اعتراض مستقیم به عدد امتیاز یا تغییر آن توسط کارشناسان ما وجود ندارد. امتیاز شما تنها در صورتی تغییر می‌کند که اطلاعات درج‌شده در گزارش شما به روز و یا اصلاح شوند.
    همچنین، در گزارش اعتباری شما، بخشی تحت عنوان «دلایل کاهش امتیاز» وجود دارد که ۵ دلیل اصلی کاهش امتیاز شما را نشان می دهد.
- q: آیا با امتیاز اعتباری پایین می توانم وام بگیرم؟
  a: |-
    بانک‌ها و دیگر وام دهندگان طبق قانون ملزم به استفاده از ابزار اعتبارسنجی هستند، اما تصمیم نهایی برای اعطای وام با خود بانک است. بسته به سیاست‌های داخلی هر بانک، ممکن است با وجود رتبه پایین، با دریافت ضمانت و وثیقه بیشتر به شما تسهیلات اعطا شود.
- q: چگونه می توانم امتیازم را افزایش دهم؟
  a: |-
    اگر در حال حاضر وام در جریان دارید: کلید اصلی افزایش امتیاز، تداوم رفتار اعتباری مثبت است. پرداخت منظم و به‌موقع اقساط، تسویه بدهی‌های سررسید شده پرداخت نشده، رفع سوءاثر چک‌ها، جلوگیری از برگشت چک، پرداخت بدهی مالیاتی و پرداخت مبلغ محکومیت مالی، مهم‌ترین عوامل افزایش امتیاز و رتبه اعتباری هستند.
    اگر در حال حاضر وام در جریان ندارید:
    دریافت یک وام و پرداخت منظم آن حداقل به مدت ۴ ماه، شما را به رتبه‌های بالاتر از C می‌رساند.
- q: اطلاعات گزارش اعتباری من در چه زمانی به روزرسانی می شود؟
  a: |-
    به جز اطلاعات تسهیلاتی که به صورت ماهانه به روزرسانی می شود، دیگر اطلاعات (مالیات، چک و محکومیت های مالی)، پس از ۲۴ ساعت به روز رسانی می شود.
    برای مشاهده تاریخ به روزرسانی اطلاعات تسهیلات بانک ها و سایر تامین کنندگان، به لینک زیر مراجعه کنید:
    https://ics24.ir/about/updatecreditor
- q: هدف از اعتبارسنجی چیست؟
  a: |-
    در گذشته، اعتبار و شهرت افراد در جامعه به واسطه آشنایی‌های شخصی و تجربیات فردی در مراوده با یکدیگر شکل می‌گرفت. عواملی نظیر رشد جمعیت، بزرگ‌تر شدن جوامع، پیچیده‌تر شدن روابط انسانی و افزایش تنوع در معاملات باعث شدند تا افراد شناخت کافی درباره‌ی کسانی که با آن‌ها در تعامل هستند، نداشته باشند.
    در این راستا، شرکت‌های اعتبارسنجی در دنیا برای رفع نیاز به سنجش اعتبار افراد تاسیس شده و این کار را با جمع‌آوری، پردازش و تحلیل اطلاعات اعتباری افراد از منابع اطلاعاتی مختلف انجام می دهند.
- q: چگونه گزارش خلاصه چک صادر کننده چک را دریافت کنم؟
  a: |-
    اگر شما گیرنده چک باشید، برای دریافت گزارش اعتبارسنجی شخص صادر کننده چک (تا قبل از نقد شدن یا انتقال چک) نیازی به اجازه صادرکننده نیست و فقط به شناسه صیادی ۱۶ رقمی نیاز دارید. برای دریافت گزارش چک صادر کننده به وبسایت https://etebarito.ir مراجعه کنید.
- q: اعضای هیئت مدیره شرکت اعتبارسنجی ایران چه اشخاصی هستند؟
  a: |-
    اعضای هیئت مدیره شرکت اعتبارسنجی ایران به شرح زیر است:
    دکتر رضا قاسم پور: مدیرعامل شرکت اعتبارسنجی ایران. این شخص دانش‌آموخته دکتری ریاضی کاربردی و کارشناسی ارشد اقتصاد از دانشگاه تهران بوده و پیش از این مدیر طرح و برنامه بانک رفاه کارگران و عضو هیئت مدیره شرکت اعتبارسنجی ایران بوده است.
    در دوره مدیریت این شخص، نسخه جدید مدل امتیازدهی اعتباری با پوشش ۱۰۰ درصدی ارائه گردید و اعتبارسنجی به حوزه چک نیز وارد شد.
    دکتر کمیل شاعری: این شخص رئیس هیئت مدیره و دانش آموخته دکتری مدیریت مالی می باشند و پیش از این، معاون سرمایه‌گذاری صندوق نوآوری و شکوفایی و رئیس هیئت‌مدیره صندوق پژوهش و فناوری نوآفرین (بزرگ‌ترین صندوق پژوهش و فناوری کشور) بوده است.
    دکتر محسن صادقی: دانش‌آموخته دکتری مدیریت مالی از دانشگاه شهید بهشتی ایران و نایب رئیس هیئت مدیره. پیش از این، ایشان در سمت مدیریت ریسک و انطباق در بانک سرمایه‌گذاری نوین و به عنوان پژوهشگری مالی در سازمان بورس و اوراق بهادار مشغول به فعالیت بوده اند.
    مهدی احمدی: مهدی احمدی، عضو هیئت مدیره شرکت اعتبارسنجی ایران و مدیرعامل شرکت رایان هم افزا می باشند.
- q: اقساط یکی از وام های من در گزارش اعتباری یافت نمی شود. چه اقدامی انجام دهم؟
  a: |-
    این موضوع را به واحد ارتباط با مشتریان شرکت اعتبارسنجی ایران با شماره ۰۲۱۴۱۵۲۲۲۲۲ اطلاع دهید تا بررسی گردد.
- q: چگونه با شرکت اعتبارسنجی ایران تماس بگیرم؟
  a: |-
    برای تماس با واحد ارتباط با مشتریان شرکت اعتبارسنجی ایران با شماره ۰۲۱۴۱۵۲۲۲۲۲ تماس بگیرید.
- q: کجا گزارش اعتباری و گزارش چک خودم را بگیرم؟
  a: |-
    برای این کار، به وبسایت اعتباریتو مراجعه فرمایید.
    www.etebarito.ics24.ir
- q: مدیران شرکت اعتبارسنجی ایران چه اشخاصی هستند؟
  a: |-
    برای اطلاع از ساختار معاونتی و مدیریتی شرکت اعتبارسنجی ایران، به لینک زیر مراجعه فرمایید:
    https://ics24.ir/about/managerteam
